; `pio run` and `pio device monitor` target the vehicle firmware only.
; Host tests are run explicitly with `pio test -e native`.
[platformio]
default_envs = nano_r4

[env:nano_r4]
platform = renesas-ra
board = nano_r4
framework = arduino
monitor_speed = 115200
; The production vehicle image. `src/bench/` is excluded here, and that exclusion
; is the guarantee that the bench instrumentation (B1-B4) cannot reach the
; vehicle: a source tree that is not compiled cannot run. `env:bench` below
; compiles it and excludes this image's `main.cpp` instead.
build_src_filter = +<*> -<bench/>

; The bench image: the same vehicle firmware, plus the bench-only instruments
; (B1 loop/watchdog readout, B2 bounded diagnostic drive, B3 raw tick readout, B4
; raw input readout) and this tree's own entry point.
;
; Upload it explicitly - `pio run -e bench -t upload` - and never mistake it for
; the vehicle image: it contains a command that applies effort outside a run, and
; the production image does not. Every line it prints starts with `BENCH`, and its
; `bench health` readout reports `image=bench`.
;
; It is not built by `pio run` (the default environment is the vehicle), and no
; protocol may be run from it until the bounded expiration and the latched fault
; have been demonstrated (`docs/bringup/P-H3-first-low-duty-drive.md`).
[env:bench]
extends = env:nano_r4
build_src_filter = +<*> -<main.cpp>

; The watchdog-enabled bench image, built once for H0W Step 1. It is the same
; bench tree with one build-time define the vehicle image never receives:
; `EV_BENCH_WATCHDOG_ENABLEMENT_REQUESTED` is the define `kWatchdogEnablementRequested`
; reads (`src/WatchdogCheckpoint.h`).
;
; Enablement is therefore an environment choice, not an edit to a header both
; images share: `pio run -e bench-watchdog` cannot change what `pio run` (the
; vehicle) or `pio run -e bench` (the H0W Step 0 baseline) decides, and
; `src/main.cpp` refuses to compile if the production image ever receives the
; define. Flipping production enablement stays a separate, deliberate change.
;
; H0W's order: `env:bench` for Step 0 (watchdog disabled baseline), this
; environment for Steps 1-7. Nothing else may be built from this environment.
[env:bench-watchdog]
extends = env:bench
build_flags = -DEV_BENCH_WATCHDOG_ENABLEMENT_REQUESTED=1

; Host-side environment for pure-logic unit tests. Run it with
; `pio test -e native` (not `pio run -e native`).
; It builds production code from lib/ only; the Arduino src/ tree is excluded
; on purpose (test_build_src = no) because it cannot compile on a host toolchain.
[env:native]
platform = native
test_framework = unity
test_build_src = no
; PlatformIO-managed host compiler, so `pio test -e native` works on a clean
; Windows machine without a manually installed MinGW/MSYS2 toolchain.
platform_packages = platformio/toolchain-gccmingw32
extra_scripts = post:scripts/native_toolchain.py
build_flags = -std=gnu++11 -Wall -Wextra
