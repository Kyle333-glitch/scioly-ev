; `pio run` and `pio device monitor` target the vehicle firmware only.
; Host tests are run explicitly with `pio test -e native`.
[platformio]
default_envs = nano_r4

; The platform is **pinned**, and that is the whole of this file's
; reproducibility story. A platform release declares the package versions it
; needs (the Arduino core and, here, the Renesas FSP), so pinning `renesas-ra`
; pins the framework with it. Unpinned, a build months from now could resolve a
; different core under the same `platformio.ini`, and the tree would no longer
; be the thing that was tested. It matters more than usual on this target: the
; FSP is shipped as a prebuilt `libfsp.a` in the Arduino core's variant and is
; not compiled from the tree, so its reset and clock setup cannot be read from
; source at all - the only record of what the firmware was built against is the
; version here (`src/bench/ResetCause.h` and D30 in `DEVELOPMENT_LOG.md` both
; depend on that being true). Bump it deliberately, and re-run the target
; checks, rather than letting a build pick it up.
;
; `platform = renesas-ra` still resolves and is not an error, but it is no
; longer what this repository builds with.
[env:nano_r4]
platform = renesas-ra@1.9.0
board = nano_r4
framework = arduino
monitor_speed = 115200
; The production vehicle image. `src/bench/` and `src/standalone/` are excluded
; here, and that exclusion is the guarantee that neither the bench
; instrumentation (B1-B4) nor the standalone diagnostic image's trigger-driven
; motor pulse can reach the vehicle: a source tree that is not compiled cannot
; run. Each of those environments compiles its own tree and excludes this
; image's `main.cpp` instead.
build_src_filter = +<*> -<bench/> -<standalone/>
; The bootloader cannot be entered by this platform's uploader alone: the
; `renesas-ra` builder wires its 1200-bps touch (the `BeforeUpload` step) only
; into the `sam-ba` protocol branch, and this board uploads over `dfu`, which runs
; `dfu-util` with nothing before it (H0 finding F-1). This pre-upload script
; performs that touch and waits for the bootloader to appear, so
; `pio run -t upload` is a complete instruction. It is inherited by the bench
; environments below and never applies to `env:native` (no board, no upload).
;
; `post:`, not `pre:`, and that is not a style choice: the script attaches its
; action to the `upload` target, and that target does not exist until the
; platform's own builder has run. Attaching from a `pre:` script silently binds
; the action to a same-named filesystem node that is never built (measured with
; a standalone SCons probe; see `DEVELOPMENT_LOG.md` D22).
extra_scripts = post:scripts/nano_upload_touch.py, pre:scripts/ev_build_identity.py
; The image variant this environment builds, as the firmware identity reports
; it (`ev::FirmwareVariant`, `lib/evcore/src/FirmwareIdentity.h`). Numeric on
; purpose: no quoting, no string comparison, and a missing define reads as
; Unknown rather than as any real image. Values: 0 production, 1 bench,
; 2 bench-watchdog.
build_flags = -DEV_FIRMWARE_VARIANT=0

; The bench image: the same vehicle firmware, plus the bench-only instruments
; (B1 loop/watchdog readout, B2 bounded diagnostic drive, B3 raw tick readout, B4
; raw input readout) and this tree's own entry point.
;
; Upload it explicitly - `pio run -e bench -t upload` - and never mistake it for
; the vehicle image: it contains a command that applies effort outside a run, and
; the production image does not. Every line it prints starts with `BENCH`, and its
; `bench health` readout reports `image=bench`.
;
; It is not built by `pio run` (the default environment is the vehicle), and no
; protocol may be run from it until the bounded expiration and the latched fault
; have been demonstrated (`docs/bringup/P-H3-first-low-duty-drive.md`).
[env:bench]
extends = env:nano_r4
build_src_filter = +<*> -<main.cpp> -<standalone/>
; TEMPORARY - the H1A electrical-gate diagnostic (`bench h1a-brake`), which
; holds the plan's awake-EN-low combination while the operator measures
; PH/EN/nSLEEP with a meter. It is gated by this define so the vehicle image
; never contains it (`src/main.cpp` refuses to compile if it leaks), it is
; explicitly temporary, and it is removed - with this line - once H1A is
; recorded. `env:bench-watchdog` sets its own `build_flags` and therefore does
; not inherit this: the diagnostic is not part of the H0W image.
build_flags = -DEV_BENCH_H1A_DIAGNOSTIC=1 -DEV_FIRMWARE_VARIANT=1

; The watchdog-enabled bench image, built once for H0W Step 1. It is the same
; bench tree with one build-time define the vehicle image never receives:
; `EV_BENCH_WATCHDOG_ENABLEMENT_REQUESTED` is the define `kWatchdogEnablementRequested`
; reads (`src/WatchdogCheckpoint.h`).
;
; Enablement is therefore an environment choice, not an edit to a header both
; images share: `pio run -e bench-watchdog` cannot change what `pio run` (the
; vehicle) or `pio run -e bench` (the H0W Step 0 baseline) decides, and
; `src/main.cpp` refuses to compile if the production image ever receives the
; define. Flipping production enablement stays a separate, deliberate change.
;
; H0W's order: `env:bench` for Step 0 (watchdog disabled baseline), this
; environment for Steps 1-7. Nothing else may be built from this environment.
[env:bench-watchdog]
extends = env:bench
build_flags = -DEV_BENCH_WATCHDOG_ENABLEMENT_REQUESTED=1 -DEV_FIRMWARE_VARIANT=2

; The standalone diagnostic image: the laptop-free, supervised, wheels-raised
; test of the battery-powered vehicle (`src/standalone/StandaloneDiagMain.cpp`).
;
; It compiles the same vehicle layer as the production image and excludes both
; other entry points, so it is impossible to build an image that contains both a
; competition run and this trigger-driven bounded pulse. What it adds is one
; `ev::StandaloneDiagnosticController`: the trigger detector, a 50/1000 effort
; pulse of at most 250 ms (hard ceiling 150 permille / 500 ms), one activation
; per power cycle, and the bench arbitration against the runtime's own fault and
; arming facts.
;
; Upload it explicitly - `pio run -e standalone-diag -t upload` - and never
; mistake it for the competition image: `docs/standalone-ev-operation.md` is the
; operating procedure, and the image identity reports `variant=standalone-diag`.
[env:standalone-diag]
extends = env:nano_r4
build_src_filter = +<*> -<bench/> -<main.cpp>
build_flags = -DEV_FIRMWARE_VARIANT=4

; Host-side environment for pure-logic unit tests. Run it with
; `pio test -e native` (not `pio run -e native`).
; It builds production code from lib/ only; the Arduino src/ tree is excluded
; on purpose (test_build_src = no) because it cannot compile on a host toolchain.
; `platform = native` is unpinned on purpose: the host tests exercise pure logic
; from `lib/`, whose result does not depend on the compiler version, and pinning
; it would mean fetching a specific host toolchain just to run them. Contrast
; with `env:nano_r4` above, where the pin is what makes the target build
; reproducible.

[env:native]
platform = native
test_framework = unity
test_build_src = no
; PlatformIO-managed host compiler, so `pio test -e native` works on a clean
; Windows machine without a manually installed MinGW/MSYS2 toolchain.
platform_packages = platformio/toolchain-gccmingw32
extra_scripts = post:scripts/native_toolchain.py
build_flags = -std=gnu++11 -Wall -Wextra -Itest/test_r3_diagnostics/mocks
